name: Musl Build

on:
  workflow_call:
    inputs:
      ring-version:
        required: true
        type: string

jobs:
  build:
    runs-on: ${{ matrix.arch == 'amd64' && 'ubuntu-latest' || 'ubuntu-24.04-arm' }}
    strategy:
      matrix:
        include:
        - arch: amd64
          image-tag: void-musl
        - arch: arm64
          image-tag: void-musl

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Clone Ring Language
      uses: actions/checkout@v4
      with:
        repository: ringpackages/ringsrc
        path: ring
        ref: ${{ inputs.ring-version }}

    - name: Cache Rust dependencies
      uses: actions/cache@v4
      with:
        path: |
          cargo-cache
          src/rust_src/target
        key: void-musl-${{ matrix.arch }}-cargo-${{ hashFiles('src/rust_src/Cargo.lock') }}
        restore-keys: |
          void-musl-${{ matrix.arch }}-cargo-

    - name: Build in Void Linux musl container
      run: |
        mkdir -p cargo-cache
        docker run --rm \
          -v ${{ github.workspace }}:/workspace \
          -v ${{ github.workspace }}/cargo-cache:/root/.cargo \
          -w /workspace \
          ghcr.io/void-linux/${{ matrix.image-tag }} sh -c '
            xbps-install -Syu
            xbps-install -y base-devel pkgconf cmake make fontconfig-devel freetype-devel libpng-devel expat-devel ninja python3 git gn curl clang
            curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
            . "$HOME/.cargo/env"
            cd ring/language
            cmake . -DCMAKE_BUILD_TYPE=Release -GNinja
            ninja install
            cd ../..
            export RING=/workspace/ring
            export SKIA_GN_COMMAND=gn
            export SKIA_NINJA_COMMAND=ninja
            export RUSTFLAGS="-C target-feature=-crt-static"
            cd src/rust_src
            cargo build --release
            chmod -R a+r /root/.cargo /workspace/src/rust_src/target
          '

    - name: Copy Rust artifacts to lib directory
      run: |
        mkdir -p lib/linux/musl/${{ matrix.arch }}
        cp src/rust_src/target/release/libring_slint.so lib/linux/musl/${{ matrix.arch }}/

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: ring-slint-linux-musl-${{ matrix.arch }}
        path: lib/linux/musl/${{ matrix.arch }}/libring_slint.so
